services:
  - type: web
    name: lm-screen-api
    # Use Docker runtime so we can install system packages (libzbar0, libgl1, etc.)
    # that are not available in Render's native Python environment.
    runtime: docker
    region: oregon
    plan: free
    branch: main
    # With Docker runtime, build/start commands come from the Dockerfile CMD.
    # dockerfilePath is relative to the repo root (default: ./Dockerfile).
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lm-screen-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: lm-screen-db
    databaseName: lmscreen
    user: lmscreen_user
    plan: free
    region: oregon
